name: Signing checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  signing-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test signing and packaging without SSL.com credentials
        run: python3 -m unittest discover -s .github/signing -p 'test_*.py' -v
